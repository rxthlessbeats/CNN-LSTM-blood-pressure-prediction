[project]
name = "cnn-lstm-blood-pressure"
version = "0.1.0"
description = "CNN-LSTM blood pressure prediction from MIMIC ECG and PPG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "matplotlib",
    "neurokit2",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "sleepecg",
    "torch",
    "tqdm",
    "wfdb",
]

[project.optional-dependencies]
keras = ["tensorflow"]

[project.scripts]
cnn-lstm-bp = "cnn_lstm_bp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnn_lstm_bp"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
